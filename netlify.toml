[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Baseline browser hardening. CSP deferred (Fonts / Maps / PostHog / Supabase).
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=(self), payment=()"
    Feature-Policy = "geolocation 'self'"

[[headers]]
  for = "/android/version.json"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/android/*.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/partner-api/openapi.yaml"
  [headers.values]
    Content-Type = "application/yaml; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300"

[[redirects]]
  from = "/partner-api"
  to = "/partner-api/"
  status = 301

[[redirects]]
  from = "/partner-api/"
  to = "/partner-api/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
