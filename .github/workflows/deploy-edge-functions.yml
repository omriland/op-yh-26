# Deploy Yahpaz Edge Functions when functions change on the production branch.
# Requires repo secret SUPABASE_ACCESS_TOKEN (Supabase Account → Access Tokens).
# Also applies a short list of idempotent migrations so they can go live without
# a full db push of older pending files.
name: Deploy Edge Functions

on:
  push:
    branches: [infra/bootstrap]
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/20260905120000_partner_webhook_events.sql"
      - "supabase/migrations/20260908040000_partner_webhook_cron_auth.sql"
      - "supabase/migrations/20260910140000_responder_level_event_freeze.sql"
      - "supabase/migrations/20260913080000_count_events_missing_lead_km_for_event_lead.sql"
      - "supabase/migrations/20260913090000_lead_km_not_required_without_vehicle.sql"
      - "supabase/migrations/20260922143000_hold_assignment_webhook_until_police_event_id.sql"
      - "supabase/migrations/20260929120000_set_locked_event_lead_km.sql"
      - "supabase/migrations/20260929082322_events_same_day_police_event_id.sql"
      - "supabase/migrations/20261005160000_fill_token_ttl_180d.sql"
      - "supabase/migrations/20261007120000_fill_token_stretch_remaining.sql"
      - "supabase/migrations/20261015100000_count_events_missing_lead_km_skip_cockpit.sql"
      - "supabase/migrations/20261015130000_skip_auto_secondary_on_participation_status.sql"
      - "supabase/migrations/20261029120000_app_review_demo_isolation.sql"
      - "supabase/migrations/20261029180000_prelaunch_gate.sql"
      - "supabase/migrations/20261029190000_prelaunch_native_block.sql"
      - "supabase/migrations/20261029200000_vehicles_member_write_error.sql"
      - "supabase/migrations/20261030120000_legacy_event_archive.sql"
      - "supabase/migrations/20261101053833_cancelled_event_without_responders_is_done.sql"
      - "supabase/migrations/20261101063100_responder_self_update_rls_recursion.sql"
      - "supabase/migrations/20261101120000_admin_smart_search.sql"
      - "supabase/migrations/20261101121000_admin_search_archive.sql"
      - "supabase/migrations/20261102120000_contacts_include_self_and_pending.sql"
      - "supabase/migrations/20261102121000_event_media_short_videos.sql"
      - ".github/workflows/deploy-edge-functions.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for access token
        id: creds
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::error::SUPABASE_ACCESS_TOKEN is not configured. Partner live-track and assignment webhooks cannot deploy. Add a Supabase account access token at Settings → Secrets and variables → Actions, then re-run this workflow."
            exit 1
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@v1
        if: steps.creds.outputs.present == 'true'
        with:
          # Pin so Actions does not hit GitHub's /releases/latest rate limit
          # ("Failed to resolve latest Supabase CLI release").
          version: 2.120.0
      - name: Apply idempotent migrations
        if: steps.creds.outputs.present == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase db query --linked --project-ref rtvizpsfvtjowbimugns \
            -f supabase/migrations/20260905120000_partner_webhook_events.sql
          supabase db query --linked --project-ref rtvizpsfvtjowbimugns \
            -f supabase/migrations/20260908040000_partner_webhook_cron_auth.sql
          supabase db query --linked --project-ref rtvizpsfvtjowbimugns \
            -f supabase/migrations/20260910140000_responder_level_event_freeze.sql
          # Must land before the frontend: the client now derives הושלם for a
          # ללא-רכב volunteer, which the old guard rejects.
          supabase db query --linked --project-ref rtvizpsfvtjowbimugns \
            -f supabase/migrations/20260913080000_count_events_missing_lead_km_for_event_lead.sql
          supabase db query --linked --project-ref rtvizpsfvtjowbimugns \
            -f supabase/migrations/20260913090000_lead_km_not_required_without_vehicle.sql
          supabase db query --linked --project-ref rtvizpsfvtjowbimugns \
            -f supabase/migrations/20260922143000_hold_assignment_webhook_until_police_event_id.sql
          supabase db query --linked --project-ref rtvizpsfvtjowbimugns \
            -f supabase/migrations/20260929120000_set_locked_event_lead_km.sql
          supabase db query --linked --project-ref rtvizpsfvtjowbimugns \
            -f supabase/migrations/20260929082322_events_same_day_police_event_id.sql
          supabase db query --linked --project-ref rtvizpsfvtjowbimugns \
            -f supabase/migrations/20261005160000_fill_token_ttl_180d.sql
          supabase db query --linked --project-ref rtvizpsfvtjowbimugns \
            -f supabase/migrations/20261007120000_fill_token_stretch_remaining.sql
          # After 20260913080000: that file still replaces this function, so
          # the cockpit exclusion has to be applied last.
          supabase db query --linked --project-ref rtvizpsfvtjowbimugns \
            -f supabase/migrations/20261015100000_count_events_missing_lead_km_skip_cockpit.sql
          supabase db query --linked --project-ref rtvizpsfvtjowbimugns \
            -f supabase/migrations/20261015130000_skip_auto_secondary_on_participation_status.sql
          # Keep after the files above: 20260929082322 replaces events_reject_same_day_police_event_id
          # and this file restores its demo-aware body. Must land before unit-broadcast
          # and responder-fill, which select profiles.is_app_review_demo.
          supabase db query --linked --project-ref rtvizpsfvtjowbimugns \
            -f supabase/migrations/20261029120000_app_review_demo_isolation.sql
          # After 20261029120000: it rewrites list_unit_contacts and
          # list_unit_map_pins, and this file adds the pre-launch check to both.
          # Inert from 2026-10-31T22:01:00Z. Must land before the frontend and
          # before responder-fill / responder-api call is_prelaunch_blocked.
          supabase db query --linked --project-ref rtvizpsfvtjowbimugns \
            -f supabase/migrations/20261029180000_prelaunch_gate.sql
          # Right after 20261029180000, which recreates the profiles and
          # user_roles gate policies in their web-only form: this file withdraws
          # the own-row exception from the iOS and Android apps. Inert after launch.
          supabase db query --linked --project-ref rtvizpsfvtjowbimugns \
            -f supabase/migrations/20261029190000_prelaunch_native_block.sql
          # Independent of the gate. Members' own-vehicle edits and deletes now
          # fail with 42501 instead of a silent no-op (admins unaffected).
          supabase db query --linked --project-ref rtvizpsfvtjowbimugns \
            -f supabase/migrations/20261029200000_vehicles_member_write_error.sql
          # Legacy event-report archive (admin-only RPC over an unexposed schema).
          # Must land before the frontend shows the archive card.
          supabase db query --linked --project-ref rtvizpsfvtjowbimugns \
            -f supabase/migrations/20261030120000_legacy_event_archive.sql
          # After 20260913090000: that replay restores the older
          # derived_event_status / guard_event_done_requirements bodies.
          # Cancelled events with no responders must stay `done`.
          supabase db query --linked --project-ref rtvizpsfvtjowbimugns \
            -f supabase/migrations/20261101053833_cancelled_event_without_responders_is_done.sql
          # event_responders_self_update must not read events inline.
          # events_select reads event_responders, and the pair raises 42P17
          # on every volunteer-row update.
          supabase db query --linked --project-ref rtvizpsfvtjowbimugns \
            -f supabase/migrations/20261101063100_responder_self_update_rls_recursion.sql
          # Admin smart search: admin_search, word variants, smart_search_log.
          # Must land before the smart-search function (it calls
          # log_smart_search) and before the frontend /search page.
          supabase db query --linked --project-ref rtvizpsfvtjowbimugns \
            -f supabase/migrations/20261101120000_admin_smart_search.sql
          # Admin smart search over the old-site archive: admin_search_archive.
          # Needs the legacy archive and admin_smart_search helpers above.
          supabase db query --linked --project-ref rtvizpsfvtjowbimugns \
            -f supabase/migrations/20261101121000_admin_search_archive.sql
          # After 20261029180000, which last replaced list_unit_contacts:
          # contacts now include the caller and members with a pending invite.
          supabase db query --linked --project-ref rtvizpsfvtjowbimugns \
            -f supabase/migrations/20261102120000_contacts_include_self_and_pending.sql
          # Event media accepts short videos (MP4 / MOV / WebM up to 25 MB).
          # Must land before the frontend offers video uploads.
          supabase db query --linked --project-ref rtvizpsfvtjowbimugns \
            -f supabase/migrations/20261102121000_event_media_short_videos.sql
      - name: Deploy functions
        if: steps.creds.outputs.present == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for fn in admin-users phone-otp send-email smart-search unit-broadcast user-feedback; do
            echo "Deploying $fn"
            supabase functions deploy "$fn" --project-ref rtvizpsfvtjowbimugns
          done
          # responder-fill load/save use the fill token, not a user JWT. Gateway
          # verify_jwt turns a stale "remember me" session into a fake expired link.
          for fn in partner-auth responder-api responder-track ios-enroll responder-fill; do
            echo "Deploying $fn (--no-verify-jwt)"
            supabase functions deploy "$fn" --project-ref rtvizpsfvtjowbimugns --no-verify-jwt
          done
