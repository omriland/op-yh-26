# Deploy Yahpaz Edge Functions when functions change on the production branch.
# Requires repo secret SUPABASE_ACCESS_TOKEN (Supabase Account → Access Tokens).
name: Deploy Edge Functions

on:
  push:
    branches: [infra/bootstrap]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-edge-functions.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for access token
        id: creds
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "SUPABASE_ACCESS_TOKEN not configured — skipping Edge deploy."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.creds.outputs.present == 'true'
        with:
          version: latest
      - name: Deploy functions
        if: steps.creds.outputs.present == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for fn in admin-users phone-otp responder-fill send-email unit-broadcast; do
            echo "Deploying $fn"
            supabase functions deploy "$fn" --project-ref rtvizpsfvtjowbimugns
          done
          for fn in partner-auth responder-api; do
            echo "Deploying $fn (--no-verify-jwt)"
            supabase functions deploy "$fn" --project-ref rtvizpsfvtjowbimugns --no-verify-jwt
          done
