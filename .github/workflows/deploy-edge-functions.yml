# Deploy Yahpaz Edge Functions when functions change on the production branch.
# Requires repo secret SUPABASE_ACCESS_TOKEN (Supabase Account → Access Tokens).
# Also applies a short list of idempotent migrations so they can go live without
# a full db push of older pending files.
name: Deploy Edge Functions

on:
  push:
    branches: [infra/bootstrap]
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/20260905120000_partner_webhook_events.sql"
      - "supabase/migrations/20260908040000_partner_webhook_cron_auth.sql"
      - "supabase/migrations/20260910140000_responder_level_event_freeze.sql"
      - "supabase/migrations/20260913080000_count_events_missing_lead_km_for_event_lead.sql"
      - "supabase/migrations/20260913090000_lead_km_not_required_without_vehicle.sql"
      - ".github/workflows/deploy-edge-functions.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for access token
        id: creds
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::error::SUPABASE_ACCESS_TOKEN is not configured. Partner live-track and assignment webhooks cannot deploy. Add a Supabase account access token at Settings → Secrets and variables → Actions, then re-run this workflow."
            exit 1
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@v1
        if: steps.creds.outputs.present == 'true'
        with:
          version: latest
      - name: Apply idempotent migrations
        if: steps.creds.outputs.present == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase db query --linked --project-ref rtvizpsfvtjowbimugns \
            -f supabase/migrations/20260905120000_partner_webhook_events.sql
          supabase db query --linked --project-ref rtvizpsfvtjowbimugns \
            -f supabase/migrations/20260908040000_partner_webhook_cron_auth.sql
          supabase db query --linked --project-ref rtvizpsfvtjowbimugns \
            -f supabase/migrations/20260910140000_responder_level_event_freeze.sql
          # Must land before the frontend: the client now derives הושלם for a
          # ללא-רכב volunteer, which the old guard rejects.
          supabase db query --linked --project-ref rtvizpsfvtjowbimugns \
            -f supabase/migrations/20260913080000_count_events_missing_lead_km_for_event_lead.sql
          supabase db query --linked --project-ref rtvizpsfvtjowbimugns \
            -f supabase/migrations/20260913090000_lead_km_not_required_without_vehicle.sql
      - name: Deploy functions
        if: steps.creds.outputs.present == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for fn in admin-users phone-otp responder-fill send-email unit-broadcast user-feedback; do
            echo "Deploying $fn"
            supabase functions deploy "$fn" --project-ref rtvizpsfvtjowbimugns
          done
          for fn in partner-auth responder-api responder-track ios-enroll; do
            echo "Deploying $fn (--no-verify-jwt)"
            supabase functions deploy "$fn" --project-ref rtvizpsfvtjowbimugns --no-verify-jwt
          done
