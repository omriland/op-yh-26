<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>אבן דרך</title>
    <script>
      /* Early visual-viewport lock before modules load (iOS Safari chrome gap). */
      (function () {
        function syncAppHeight() {
          var h =
            (window.visualViewport && window.visualViewport.height) || window.innerHeight
          document.documentElement.style.setProperty(
            '--app-height',
            Math.max(1, Math.round(h)) + 'px',
          )
          if (window.scrollX || window.scrollY) window.scrollTo(0, 0)
        }
        syncAppHeight()
        window.addEventListener('resize', syncAppHeight)
        window.addEventListener('orientationchange', syncAppHeight)
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', syncAppHeight)
          window.visualViewport.addEventListener('scroll', syncAppHeight)
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=Suez+One&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
